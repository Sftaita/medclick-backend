framework:
    # Limites par adresse IP sur les routes publiques (voir App\Security\PublicEndpointRateLimiter).
    # La connexion est limitée séparément par "login_throttling" (security.yaml).
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        client_errors:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        marketing_click:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        # Impressions et clics publicitaires : quelques événements par écran et par minute suffisent.
        marketing_event:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # Impressions et clics des emplacements partenaires (barre latérale sur chaque page).
        partner_event:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # Demandes d'export Excel, par utilisateur (App\Controller\ExportController).
        export_request:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Recherche publique des codes INAMI : une requête par pause de frappe et par page de
        # résultats ; 240 par minute laissent une utilisation intensive sans permettre l'aspiration
        # rapide de la nomenclature.
        inami_search:
            policy: sliding_window
            limit: 240
            interval: '1 minute'
        # Statistiques de la recherche INAMI : une visite et quelques spécialités par page.
        inami_event:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        password_reset:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
