security:

  password_hashers:
    App\Entity\User:
      algorithm: auto

  # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    login:
      pattern: ^/api/login
      stateless: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      json_login:
        check_path: /api/login_check
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure
      # Anti force brute : 5 échecs par couple email/IP (et 25 par IP) par tranche de 15 minutes.
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'

    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      jwt: ~

    main:
      lazy: true
      provider: app_user_provider

  # Note: Only the *first* access control that matches will be used
  access_control:
    # Routes publiques (liste blanche). Tout le reste de /api exige un JWT (dernière règle).
    - { path: ^/api/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/users$, roles: PUBLIC_ACCESS, methods: [POST] }
    - { path: ^/api/forgottenPassword$, roles: PUBLIC_ACCESS, methods: [POST] }
    - { path: ^/api/resetPassword$, roles: PUBLIC_ACCESS, methods: [POST] }
    # Rapports d'erreurs des fronts (aussi avant connexion ; limité en débit).
    - { path: ^/api/client-errors$, roles: PUBLIC_ACCESS, methods: [POST] }
    - { path: ^/api/terms-conditions, roles: PUBLIC_ACCESS, methods: [GET] }
    # Plein écran (/api/marketing/active) : réservé aux utilisateurs connectés, affiché après
    # une connexion réussie (règle générale ^/api ci-dessous).
    # Clic sur la publicité depuis la page de connexion (limité en débit).
    - { path: ^/api/marketing/incrementCampaign/\d+$, roles: PUBLIC_ACCESS, methods: [PUT] }
    # Campagnes par emplacement (connexion, tableau de bord) et mesure des impressions et des
    # clics (aussi avant connexion ; limitée en débit, docs/SPONSORS.md).
    - { path: ^/api/marketing/slots$, roles: PUBLIC_ACCESS, methods: [GET] }
    - { path: ^/api/marketing/events$, roles: PUBLIC_ACCESS, methods: [POST] }
    # Visuels importés des campagnes (publicité de la page de connexion).
    - { path: '^/api/marketing/image/[a-f0-9]{64}\.webp$', roles: PUBLIC_ACCESS, methods: [GET] }
    # Partenaire affiché et son logo (écran de connexion, avant toute session).
    - { path: ^/api/partner/active$, roles: PUBLIC_ACCESS, methods: [GET] }
    # Firme de chaque emplacement partenaire, fiche d'une firme diffusée, mesure (limitée en débit).
    - { path: ^/api/partner/placements$, roles: PUBLIC_ACCESS, methods: [GET] }
    - { path: ^/api/partner/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
    - { path: ^/api/partner/events$, roles: PUBLIC_ACCESS, methods: [POST] }
    - { path: '^/api/partner/logo/[a-f0-9]{64}\.(png|svg)$', roles: PUBLIC_ACCESS, methods: [GET] }

    - { path: ^/api/admin, roles: ROLE_ADMIN }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
