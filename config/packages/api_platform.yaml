api_platform:
    title: MedClick API
    mapping:
        paths: ['%kernel.project_dir%/src/Entity']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    patch_formats:
        json: ['application/merge-patch+json']
    serializer:
        # Le front lit response.data["hydra:member"] : conserver le préfixe "hydra:" (API Platform 2).
        hydra_prefix: true
    defaults:
        stateless: true
        extra_properties:
            # PUT partiel comme en API Platform 2 : le front n'envoie que les champs modifiés.
            standard_put: false
