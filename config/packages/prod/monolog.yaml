monolog:
    handlers:
        # À la première erreur d'une requête, écrit aussi les messages qui l'ont précédée.
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        # Fichier par jour, conservé 30 jours (var/log/ n'est pas accessible depuis le web).
        # Secours de la table error_log si la base est indisponible.
        nested:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: 30
            level: debug
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
