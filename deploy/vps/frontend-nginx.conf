# nginx du frontend MedClick (fichiers statiques du build Vite). Copié dans l'image sous le nom
# /etc/nginx/conf.d/default.conf. Les en-têtes de sécurité sont posés par Traefik (secure-headers).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Service worker, page d'entrée et manifest : jamais en cache HTTP, sinon une mise à jour
    # resterait bloquée derrière une ancienne version.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers versionnés (nom avec empreinte) : cache long. Un fichier absent répond 404 — jamais
    # index.html, qui serait servi à la place d'un script et ferait échouer silencieusement le
    # chargement d'un ancien chunk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fichiers cachés, dossiers de code et fichiers sensibles : rien de tel n'est servi ici (le code
    # backend n'est pas dans ce conteneur), mais on répond 404 explicitement plutôt que l'application.
    location ~ (^|/)\. {
        return 404;
    }
    location ~ ^/(src|config|vendor|var|bin|migrations|templates|tests|node_modules)(/|$) {
        return 404;
    }
    location ~* \.(pem|key|env|log|php|sql|gz|bak|ya?ml|lock)$ {
        return 404;
    }

    # Routes de l'application (BrowserRouter) : repli sur index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
