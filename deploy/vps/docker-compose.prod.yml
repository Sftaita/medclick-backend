# Production MedClick sur le VPS (projet Compose « medclick-prod »), cible de la bascule (LOT 4,
# docs/RUNBOOK-BASCULE.md). Répertoire sur le VPS : /opt/stack/apps/medclick-prod.
#   src/backend, src/pwa, .env (chmod 600, modèle deploy/vps/.env.prod.example) : comme la préproduction.
#
# Différences avec la préproduction : pas de Mailpit (SMTP réel du .env), pas de liste d'IP,
# domaines de production :
#   - www.medclick.be            : nouveau frontend ; /api et /activation → backend (même origine),
#                                  routes actives seulement avec WWW_LIVE=true (bascule B) ;
# Images nommées medclick-prod-* : jamais partagées avec la préproduction (le frontend embarque
# l'URL d'API à la construction ; un même nom serait réécrit par un déploiement du staging).
#   - api-medclick.easymed.fun   : backend entier (anciens fronts CRA et admin pendant la transition,
#                                  liens d'activation déjà envoyés) ;
#   - medclick.be                : redirection permanente vers https://www.medclick.be, sauf
#                                  /service-worker.js (SW de remplacement de l'ancien front CRA).

name: medclick-prod

services:
  db:
    image: mariadb:11.8
    container_name: medclick-prod-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - medclick_prod_db:/var/lib/mysql
    networks:
      - medclick-prod-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./src/backend
      dockerfile: deploy/vps/backend.Dockerfile
    image: medclick-prod-backend:${BACKEND_TAG:?BACKEND_TAG absent, lancer deploy.sh qui l enregistre dans .env}
    container_name: medclick-prod-backend
    restart: unless-stopped
    environment: &backend-environment
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=11.8.9-MariaDB&charset=utf8mb4
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAILER_DSN: ${MAILER_DSN}
      ERROR_ALERT_EMAIL: ${ERROR_ALERT_EMAIL:-}
      # Traefik (réseau Docker « proxy », 172.18.0.0/16) est le seul pair direct du backend (aucun
      # port publié) et réécrit X-Forwarded-For/Proto/Port : seuls ces en-têtes font foi. Jamais
      # « forwarded » (RFC 7239), que Traefik transmet tel quel. Sous-réseau modifié = confiance perdue.
      SYMFONY_TRUSTED_PROXIES: 172.18.0.0/16
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto,x-forwarded-port
      # Valeurs actuelles de la production (identiques aux défauts de config/services.yaml).
      PUBLIC_FRONTEND_URL: https://www.medclick.be
      PUBLIC_API_URL: https://api-medclick.easymed.fun
      # Exports Excel asynchrones (docs/EXPORTS.md) ; alertes : EXPORT_ALERT_EMAIL, sinon ERROR_ALERT_EMAIL.
      EXPORT_ALERT_EMAIL: ${EXPORT_ALERT_EMAIL:-}
      EXPORT_STORAGE_DIR: /app/var/exports
    volumes:
      - medclick_prod_jwt:/app/config/jwt
      - medclick_prod_log:/app/var/log
      - medclick_prod_exports:/app/var/exports
    networks:
      - proxy
      - medclick-prod-internal
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Bascule A : seul api-medclick.easymed.fun est routé ici (anciens fronts, liens d'activation).
      - "traefik.http.routers.medclick-prod-api.rule=Host(`api-medclick.easymed.fun`)"
      - "traefik.http.routers.medclick-prod-api.priority=100"
      - "traefik.http.routers.medclick-prod-api.entrypoints=websecure"
      - "traefik.http.routers.medclick-prod-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.medclick-prod-api.middlewares=secure-headers@file,compress@file"
      - "traefik.http.routers.medclick-prod-api.service=medclick-prod-backend"
      - "traefik.http.services.medclick-prod-backend.loadbalancer.server.port=80"

  # Worker des exports Excel (voir docker-compose.staging.yml) : aucune entrée réseau, ressources plafonnées.
  worker:
    image: medclick-prod-backend:${BACKEND_TAG:?BACKEND_TAG absent, lancer deploy.sh qui l enregistre dans .env}
    container_name: medclick-prod-worker
    restart: unless-stopped
    # Cache préchauffé (dont le gabarit Excel analysé) avant de consommer la file.
    command: ["sh", "-c", "php bin/console cache:warmup && exec php bin/console messenger:consume exports scheduler_exports_monitor --time-limit=3600 --memory-limit=400M --sleep=1 -v"]
    # Le contrôle HTTP de l'image backend ne s'applique pas : le worker ne sert pas de HTTP.
    # Sain = le processus principal est le consommateur (après le préchauffage du cache).
    healthcheck:
      test: ["CMD-SHELL", "grep -qa messenger:consume /proc/1/cmdline && ! grep -qa cache:warmup /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    environment: *backend-environment
    volumes:
      - medclick_prod_log:/app/var/log
      - medclick_prod_exports:/app/var/exports
    networks:
      - medclick-prod-internal
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 120s

  frontend:
    build:
      context: ./src/pwa/frontend
      dockerfile: ../../backend/deploy/vps/frontend.Dockerfile
      additional_contexts:
        deploy: ./src/backend/deploy/vps
      args:
        VITE_API_URL: https://www.medclick.be/api/
        # Image en service (deploy.sh) : ses assets/ restent servis pour les onglets ouverts.
        PREVIOUS_IMAGE: ${PREVIOUS_FRONTEND_IMAGE:-nginx:1.29-alpine}
    image: medclick-prod-frontend:${FRONTEND_TAG:?FRONTEND_TAG absent, lancer deploy.sh qui l enregistre dans .env}
    container_name: medclick-prod-frontend
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      backend:
        condition: service_healthy
    # Bascule B : routes www.medclick.be et medclick.be activées seulement avec WWW_LIVE=true dans
    # le .env (sinon Traefik demanderait des certificats pour des noms encore chez Hostinger).
    labels:
      - "traefik.enable=${WWW_LIVE:-false}"
      - "traefik.docker.network=proxy"
      # /api et /activation de www.medclick.be → service du backend (même origine pour le front).
      - "traefik.http.routers.medclick-prod-www-api.rule=Host(`www.medclick.be`) && (PathPrefix(`/api`) || PathPrefix(`/activation`))"
      - "traefik.http.routers.medclick-prod-www-api.priority=100"
      - "traefik.http.routers.medclick-prod-www-api.entrypoints=websecure"
      - "traefik.http.routers.medclick-prod-www-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.medclick-prod-www-api.middlewares=secure-headers@file,compress@file"
      - "traefik.http.routers.medclick-prod-www-api.service=medclick-prod-backend@docker"
      - "traefik.http.routers.medclick-prod-web.rule=Host(`www.medclick.be`)"
      - "traefik.http.routers.medclick-prod-web.priority=10"
      - "traefik.http.routers.medclick-prod-web.entrypoints=websecure"
      - "traefik.http.routers.medclick-prod-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.medclick-prod-web.middlewares=secure-headers@file,compress@file"
      - "traefik.http.routers.medclick-prod-web.service=medclick-prod-frontend"
      - "traefik.http.services.medclick-prod-frontend.loadbalancer.server.port=80"
      # medclick.be → https://www.medclick.be (même chemin).
      - "traefik.http.routers.medclick-prod-apex.rule=Host(`medclick.be`)"
      - "traefik.http.routers.medclick-prod-apex.entrypoints=websecure"
      - "traefik.http.routers.medclick-prod-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.medclick-prod-apex.middlewares=medclick-prod-to-www"
      - "traefik.http.routers.medclick-prod-apex.service=noop@internal"
      - "traefik.http.middlewares.medclick-prod-to-www.redirectregex.regex=^https://medclick\\.be/(.*)"
      - "traefik.http.middlewares.medclick-prod-to-www.redirectregex.replacement=https://www.medclick.be/$${1}"
      - "traefik.http.middlewares.medclick-prod-to-www.redirectregex.permanent=true"

  # Service worker de remplacement pour https://medclick.be/service-worker.js. L'ancien front CRA
  # était aussi servi sur l'apex : son SW y continue de servir l'ancienne version depuis le cache, et
  # ne peut pas se mettre à jour tant que son script est redirigé (refusé par les navigateurs). Ce
  # script, servi en 200, le remplace, renvoie vers www et retire ses caches. Toutes les autres URL
  # de l'apex restent redirigées par medclick-prod-apex. Retour arrière : arrêter ce service.
  legacy-apex-sw:
    image: nginx:1.29-alpine
    container_name: medclick-prod-legacy-apex-sw
    restart: unless-stopped
    networks:
      - proxy
    configs:
      - source: legacy-apex-sw-nginx
        target: /etc/nginx/conf.d/default.conf
      - source: legacy-apex-sw-js
        target: /usr/share/nginx/apex/service-worker.js
    labels:
      - "traefik.enable=${WWW_LIVE:-false}"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.medclick-prod-apex-sw.rule=Host(`medclick.be`) && Path(`/service-worker.js`)"
      - "traefik.http.routers.medclick-prod-apex-sw.priority=1000"
      - "traefik.http.routers.medclick-prod-apex-sw.entrypoints=websecure"
      - "traefik.http.routers.medclick-prod-apex-sw.tls.certresolver=letsencrypt"
      - "traefik.http.routers.medclick-prod-apex-sw.middlewares=secure-headers@file"
      - "traefik.http.routers.medclick-prod-apex-sw.service=medclick-prod-legacy-apex-sw"
      - "traefik.http.services.medclick-prod-legacy-apex-sw.loadbalancer.server.port=80"

configs:
  legacy-apex-sw-nginx:
    content: |
      server {
          listen 80;
          server_name _;
          server_tokens off;
          location = /service-worker.js {
              root /usr/share/nginx/apex;
              default_type application/javascript;
              add_header Cache-Control "no-cache, no-store, must-revalidate";
          }
          location / {
              return 404;
          }
      }
  legacy-apex-sw-js:
    content: |
      // Remplace le service worker de l'ancien front CRA sur https://medclick.be (l'application vit
      // désormais sur www). Ne touche ni au localStorage ni à IndexedDB : seulement aux caches du SW CRA.
      const WWW = 'https://www.medclick.be';
      const isOldCache = (name) => name.startsWith('workbox-precache') || name.startsWith('workbox-runtime') || name === 'images';

      self.addEventListener('install', () => self.skipWaiting());

      self.addEventListener('activate', (event) => event.waitUntil((async () => {
        await self.clients.claim();
        // Onglets en arrière-plan : basculés tout de suite. Onglet affiché : à son prochain chargement,
        // pour ne pas perdre une saisie en cours (l'ancien front reste fonctionnel d'ici là).
        const windows = await self.clients.matchAll({ type: 'window' });
        await Promise.all(windows
          .filter((client) => client.visibilityState !== 'visible')
          .map((client) => client.navigate(toWww(client.url)).catch(() => {})));
        await cleanupIfIdle();
      })()));

      self.addEventListener('fetch', (event) => {
        const { request } = event;
        const url = new URL(request.url);
        if (url.origin !== self.location.origin) return;
        if (request.mode === 'navigate') {
          event.respondWith(Response.redirect(toWww(request.url), 302));
          // Après la redirection, plus aucun onglet sur medclick.be : caches et enregistrement retirés.
          event.waitUntil(new Promise((resolve) => setTimeout(resolve, 5000)).then(cleanupIfIdle));
          return;
        }
        // Onglet de l'ancien front encore ouvert : ses fichiers (chunks chargés à la demande) restent
        // servis depuis le cache, le serveur de medclick.be ne les a plus.
        if (request.method === 'GET') {
          event.respondWith(caches.match(request).then((cached) => cached || fetch(request)));
        }
      });

      function toWww(href) {
        const url = new URL(href);
        return WWW + url.pathname + url.search + url.hash;
      }

      async function cleanupIfIdle() {
        const windows = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
        if (windows.length > 0) return;
        const names = await caches.keys();
        await Promise.all(names.filter(isOldCache).map((name) => caches.delete(name)));
        await self.registration.unregister();
      }

networks:
  proxy:
    name: proxy
    external: true
  medclick-prod-internal:
    name: medclick-prod-internal

volumes:
  medclick_prod_db:
  medclick_prod_jwt:
  medclick_prod_log:
  medclick_prod_exports:
