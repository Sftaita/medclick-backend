# Accès navigateur de recette à la PRÉPRODUCTION MedClick, par tunnel SSH (docs/DEPLOIEMENT-VPS.md,
# « Accès navigateur de recette »). Service « recette-acces » du Compose de préproduction, inactif par
# défaut (profil), publié seulement sur 127.0.0.1 du VPS : aucune exposition publique, Traefik non
# utilisé ni modifié.
#
# Même origine pour l'application et l'API (http://localhost:8095 côté poste) :
# - /api/ et /activation : backend (réseau interne de la préproduction) ;
# - le reste : frontend (même image que celle servie par Traefik), dont l'URL absolue de l'API,
#   fixée au build, est réécrite en « /api/ » à la volée.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 6m;

    location ~ ^/(api|activation)(/|$) {
        proxy_pass http://backend:80;
        proxy_set_header Host staging.medclick.be;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host staging.medclick.be;
        # Réponses non compressées : nécessaire à la réécriture ci-dessous.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter "https://staging.medclick.be/api/" "/api/";
    }
}
