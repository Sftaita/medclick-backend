# Ancien front CRA (test de transition) : en-têtes calqués sur l'hébergement actuel (CDN Hostinger)
# — service-worker.js et scripts en « public, max-age=604800 », index.html sans Cache-Control.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /service-worker.js {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /static/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
