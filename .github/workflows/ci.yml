name: CI

on:
  push:
    branches: [master, "securite/**", "outillage/**", "migration/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Même version que la production (Hostinger, PHP 8.4 requis par Symfony 8).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, zip, gd, xml, sodium
          coverage: none

      - name: Valider composer.json
        run: composer validate --no-check-publish

      - name: Installer les dépendances
        # --no-scripts : les auto-scripts lancent les migrations, qui exigent MySQL.
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Configuration de test
        run: |
          cp .env.example .env
          php bin/console lexik:jwt:generate-keypair --env=test --no-interaction

      - name: Vérifier le conteneur et le mapping Doctrine
        run: |
          php bin/console lint:container --env=test
          php bin/console doctrine:schema:validate --skip-sync --env=test

      - name: Tests
        run: composer test

      - name: Vulnérabilités connues (informatif)
        continue-on-error: true
        run: composer audit
